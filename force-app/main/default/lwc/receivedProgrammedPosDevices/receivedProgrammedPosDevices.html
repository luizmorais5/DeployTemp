<template>
    <!-- Top Right Controls -->
    <div class="slds-grid slds-gutters slds-m-bottom_medium slds-grid_align-end">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
            <lightning-input
                type="search"
                label="Search Devices"
                placeholder="Search by Serial Number, TID, Merchant Name, or Model"
                value={searchTerm}
                onchange={handleSearch}
                variant="label-hidden"
            ></lightning-input>
        </div>
        <div class="slds-col slds-no-flex">
            <lightning-button
                label="Confirmed"
                variant="brand"
                onclick={handleReturnToProgrammer}
                disabled={disableReturnButton}
                class="slds-m-left_small"
            ></lightning-button>
        </div>
    </div>

    <!-- Loading Spinner -->
    <template if:true={isLoading}>
        <div class="slds-m-vertical_medium">
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </div>
    </template>

    <!-- Error Message -->
    <template if:true={error}>
        <div class="slds-m-vertical_medium">
            <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                <span class="slds-assistive-text">Error</span>
                <h2>Error loading devices: {error.body.message}</h2>
            </div>
        </div>
    </template>

    <!-- Info about picked up devices -->
    <template if:true={pickedUpDevicesCount}>
        <div class="slds-m-vertical_small">
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_warning" role="alert">
                <span class="slds-assistive-text">warning</span>
                <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                <h2 class="slds-m-left_x-small">Devices that have been picked up by MSOs cannot be returned to the programming team</h2>
            </div>
        </div>
    </template>

    <!-- Data Table -->
    <template if:true={hasDevices}>
        <div class="slds-m-vertical_medium">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th class="slds-text-title_caps slds-truncate" scope="col">
                            Model
                        </th>
                        <th class="slds-text-title_caps slds-truncate" scope="col">
                            Serial Number
                        </th>
                        <th class="slds-text-title_caps" scope="col">
                            Sim Card 1
                        </th>
                        <th class="slds-text-title_caps" scope="col">
                            Sim Card 2
                        </th>
                        <th class="slds-text-title_caps" scope="col">
                            Case Number
                        </th>
                        <th class="slds-text-title_caps slds-truncate" scope="col">
                            Terminal ID
                        </th>
                        <th class="slds-text-title_caps slds-is-sortable" scope="col">
                            Merchant Name
                        </th>
                        <th class="slds-text-title_caps" scope="col">
                            Merchant Address
                        </th>
                        <th class="slds-text-title_caps" scope="col">
                            Return to Programming
                        </th>
                        <th class="slds-text-title_caps" scope="col">
                            Date received
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={filteredDevices} for:item="device">
                        <tr key={device.id} class={device.rowClass}>
                            <td class="slds-truncate">
                                {device.model}
                            </td>
                            <td class="slds-truncate">
                                {device.serialNumber}
                            </td>
                            <td class="slds-truncate">
                                {device.simCard1}
                            </td>
                            <td class="slds-truncate">
                                {device.simCard2}
                            </td>
                            <td class="slds-truncate">
                                {device.caseNumber}
                            </td>
                            <td class="slds-truncate">
                                {device.tid}
                            </td>
                            <td class="slds-truncate">
                                {device.merchantName}
                            </td>
                            <td class="slds-truncate">
                                {device.merchantAddress}
                            </td>
                            <td class="slds-truncate">
                                <lightning-input
                                    type="checkbox"
                                    checked={device.returnToProgrammer}
                                    disabled={device.isPickedUp}
                                    onchange={handleReturnToProgrammerChange}
                                    data-id={device.id}
                                    variant="label-hidden"
                                ></lightning-input>
                            </td>
                            <td class="slds-truncate">
                                {device.dateReceived}
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>

    <!-- No Data Message -->
    <template lwc:if={showNoDataMessage}>
        <div class="slds-m-vertical_large slds-text-align_center" style="margin: 8vh 0;">
            <h3 class="slds-text-heading_medium">No received programmed POS devices found</h3>
            <p class="slds-text-body_regular">
                There are currently no received programmed POS devices available.
            </p>
        </div>
    </template>
</template>
