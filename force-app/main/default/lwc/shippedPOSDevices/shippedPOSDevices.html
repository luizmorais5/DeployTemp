<template>
    <lightning-card>
        <div class="slds-p-horizontal_medium">
            <!-- Scenario 1: Shipping Options - Ship to Hub / Ship to Territory -->
            <div class="slds-m-bottom_medium">
                <lightning-radio-group
                    name="shippingMode"
                    label="Select Shipping Mode"
                    options={shippingModeOptions}
                    value={selectedShippingMode}
                    onchange={handleShippingModeChange}
                    type="button"
                ></lightning-radio-group>
            </div>

            <!-- Scenario 2: Ship to Hub Selection -->
            <template lwc:if={isShipToHubMode}>
                <div class="slds-m-bottom_medium">
                    <lightning-combobox
                        name="hubSelection"
                        label="Select Hub"
                        placeholder="Choose a hub"
                        options={hubOptions}
                        value={selectedHub}
                        onchange={handleHubChange}
                        required
                    ></lightning-combobox>
                </div>
            </template>

            <!-- Ship to Territory Selection -->
            <template lwc:if={isShipToTerritoryMode}>
                <div class="slds-m-bottom_medium">
                    <lightning-combobox
                        name="territorySelection"
                        label="Select Territory"
                        placeholder="Choose a territory"
                        options={territoryOptions}
                        value={selectedTerritory}
                        onchange={handleTerritoryChange}
                        required
                    ></lightning-combobox>
                </div>
            </template>

            <!-- Tab Selection for Viewing Shipped Devices -->
            <template lwc:if={showDeviceViews}>
                <div class="slds-m-bottom_medium">
                    <lightning-radio-group
                        name="deviceViewSelection"
                        label="Select View"
                        options={deviceViewOptions}
                        value={activeDeviceView}
                        onchange={handleDeviceViewChange}
                        type="button"
                    ></lightning-radio-group>
                </div>
            </template>

            <!-- Search and Controls -->
            <template lwc:if={showDeviceViews}>
                <div class="slds-grid slds-gutters slds-m-bottom_medium slds-grid_align-end">
                    <!-- Scenario 4: Search functionality -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-input
                            type="search"
                            label="Search Devices"
                            placeholder="Search by Serial Number, TID, Merchant Name, or Model"
                            value={searchTerm}
                            onchange={handleSearch}
                            variant="label-hidden"
                        ></lightning-input>
                    </div>
                    <!-- Scenario 5: Confirmation button for shipment -->
                    <div class="slds-col slds-no-flex" lwc:if={showConfirmButton}>
                        <lightning-button
                            label={confirmButtonLabel}
                            variant="brand"
                            onclick={handleConfirmAction}
                            disabled={disableConfirmButton}
                            class="slds-m-left_small"
                        ></lightning-button>
                    </div>
                </div>
            </template>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-m-vertical_medium">
                    <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Error Message -->
            <template if:true={error}>
                <div class="slds-m-vertical_medium">
                    <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                        <span class="slds-assistive-text">Error</span>
                        <h2>Error loading devices: {error.body.message}</h2>
                    </div>
                </div>
            </template>

            <!-- Scenario 3, 7, 9: Data Table for displaying devices -->
            <template if:true={hasDevices}>
                <div class="slds-m-vertical_medium">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th class="slds-text-title_caps slds-truncate" scope="col">
                                    Serial Number
                                </th>
                                <th class="slds-text-title_caps slds-is-sortable" scope="col" data-field="model">
                                    Model
                                </th>
                                <th class="slds-text-title_caps slds-is-sortable" scope="col" data-field="tid">
                                    TID
                                </th>
                                <th class="slds-text-title_caps" scope="col">
                                    SIM Card 1
                                </th>
                                <th class="slds-text-title_caps" scope="col">
                                    SIM Card 2
                                </th>
                                <th class="slds-text-title_caps" scope="col">
                                    Case ID
                                </th>
                                <th class="slds-text-title_caps slds-is-sortable" scope="col" data-field="merchantName">
                                    Merchant Name
                                </th>
                                <th class="slds-text-title_caps" scope="col">
                                    Merchant Address
                                </th>
                                <!-- Scenario 3: Shipped column for POS Devices for Shipment view -->
                                <th class="slds-text-title_caps" scope="col" lwc:if={showShippedColumn}>
                                    Shipped
                                </th>
                                <!-- Scenario 6: Date Sent column for Shipped POS Devices view -->
                                <th class="slds-text-title_caps" scope="col" lwc:if={showReceivedColumn}>
                                    Date Sent
                                </th>
                                <!-- Scenario 7: Received column for Shipped POS Devices view -->
                                <th class="slds-text-title_caps" scope="col" lwc:if={showReceivedColumn}>
                                    Received
                                </th>
                                <!-- Scenario 8: Date Received column for Received Shipped POS Devices view -->
                                <th class="slds-text-title_caps" scope="col" lwc:if={showReshipColumn}>
                                    Date Received
                                </th>
                                <!-- Scenario 9: Reship column for Received Shipped POS Devices view -->
                                <th class="slds-text-title_caps" scope="col" lwc:if={showReshipColumn}>
                                    Reship
                                </th>
                                <th class="slds-text-title_caps" scope="col" lwc:if={showReshipDestinationColumn}>
                                    Reship Destination
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredDevices} for:item="device">
                                <tr key={device.id} class={device.rowClass}>
                                    <td class="slds-truncate">
                                        {device.serialNumber}
                                    </td>
                                    <td class="slds-truncate">
                                        {device.model}
                                    </td>
                                    <td class="slds-truncate">
                                        {device.tid}
                                    </td>
                                    <td class="slds-truncate">
                                        {device.simCard1}
                                    </td>
                                    <td class="slds-truncate">
                                        {device.simCard2}
                                    </td>
                                    <td class="slds-truncate">
                                        {device.caseNumber}
                                    </td>
                                    <td class="slds-truncate">
                                        {device.merchantName}
                                    </td>
                                    <td class="slds-truncate">
                                        {device.merchantAddress}
                                    </td>
                                    <!-- Scenario 3: Shipped checkbox (checked by default) -->
                                    <td class="slds-truncate" lwc:if={showShippedColumn}>
                                        <lightning-input
                                            type="checkbox"
                                            checked={device.shipped}
                                            onchange={handleShippedChange}
                                            data-id={device.id}
                                            variant="label-hidden"
                                        ></lightning-input>
                                    </td>
                                    <!-- Scenario 6: Date Sent display -->
                                    <td class="slds-truncate" lwc:if={showReceivedColumn}>
                                        <lightning-formatted-date-time
                                            value={device.dateSent}
                                            year="numeric"
                                            month="short"
                                            day="2-digit"
                                            hour="2-digit"
                                            minute="2-digit"
                                        ></lightning-formatted-date-time>
                                    </td>
                                    <!-- Scenario 7: Received checkbox -->
                                    <td class="slds-truncate" lwc:if={showReceivedColumn}>
                                        <lightning-input
                                            type="checkbox"
                                            checked={device.received}
                                            onchange={handleReceivedChange}
                                            data-id={device.id}
                                            variant="label-hidden"
                                        ></lightning-input>
                                    </td>
                                    <!-- Scenario 8: Date Received display -->
                                    <td class="slds-truncate" lwc:if={showReshipColumn}>
                                        <lightning-formatted-date-time
                                            value={device.dateReceived}
                                            year="numeric"
                                            month="short"
                                            day="2-digit"
                                            hour="2-digit"
                                            minute="2-digit"
                                        ></lightning-formatted-date-time>
                                    </td>
                                    <!-- Scenario 9: Reship checkbox -->
                                    <td class="slds-truncate" lwc:if={showReshipColumn}>
                                        <lightning-input
                                            type="checkbox"
                                            checked={device.reship}
                                            onchange={handleReshipChange}
                                            data-id={device.id}
                                            variant="label-hidden"
                                        ></lightning-input>
                                    </td>
                                    <!-- Scenario 9: Reship Destination picklist -->
                                    <td class="slds-truncate" lwc:if={showReshipDestinationColumn}>
                                        <lightning-combobox
                                            name="reshipDestination"
                                            placeholder="Select destination"
                                            options={reshipDestinationOptions}
                                            value={device.reshipDestination}
                                            onchange={handleReshipDestinationChange}
                                            data-id={device.id}
                                            variant="label-hidden"
                                        ></lightning-combobox>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- No Data Message -->
            <template lwc:if={showNoDataMessage}>
                <div class="slds-m-vertical_large slds-text-align_center" style="margin: 8vh 0;">
                    <h3 class="slds-text-heading_medium">{noDataMessage}</h3>
                    <p class="slds-text-body_regular">
                        {noDataDescription}
                    </p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
